<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>MIND - Equipe Atual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap e Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Componentes -->
  <script src="javascript/components/menu.js" defer></script>
  <script src="javascript/components/footer.js" defer></script>
  <script src="javascript/components/components.js" defer></script>
  <link rel="stylesheet" href="css/style.css">

  <style>
  #page-wrapper {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 100vh;
    margin: auto;
    overflow: auto;
  }

  h2, h5 {
    text-align: center;
  }

  /* ===== Galeria Responsiva ===== */
  .gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:1.8rem;
padding:10px;
justify-items:center;
}

  /* ===== Card ===== */
 .card{
display:flex;
flex-direction:column;
background:#fff;
border-radius:14px;
overflow:hidden;

width:100%;
max-width:520px;   /* largura maior */

height:100%;

box-shadow:0 4px 14px rgba(0,0,0,0.12);
transition:all .25s ease;

border-top:4px solid #0d6efd;
}

  .card:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

 .card img{
width:100%;
height:280px;
object-fit:cover;
object-position:center;
}

  /* ===== Legenda ===== */
  .legend {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0.6rem;
    font-size: 0.9rem;
    background: #fff;
    color: #444;
    min-height: 120px;
  }

  .card-nome {
    font-weight: 600;
    color: #000;
    margin-bottom: 0.3rem;
  }

  .card-participacao {
    font-size: 0.85rem;
    color: #007bff;
    margin-bottom: 0.2rem;
  }

  .card-formacao {
    font-size: 0.82rem;
    color: #555;
    text-align: justify;
    line-height: 1.2;
  }

  /* ===== Responsividade ===== */
  @media (max-width: 576px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
    .card { max-width: 180px; }
  }

  @media (max-width: 400px) {
    .gallery { grid-template-columns: 1fr; }
    .card { max-width: 100%; }
  }
  </style>
</head>

<body class="py-0">
  <meu-menu></meu-menu>

  <div id="page-wrapper" class="container-fluid my-4">
    <h2 class="text-danger fw-bold">Movimento para Inclusão e Neurodiversidade</h2>

    <div class="d-flex justify-content-center align-items-center flex-wrap gap-2 mt-3 mb-3">
      <h5 class="text-black m-0">Conheça os Membros Atuais da Equipe</h5>
      <a href="autores.html" class="btn btn-primary">
        <i class="bi bi-arrow-left-circle me-1"></i> Ver Dados Completos
      </a>
    </div>

    <!-- Filtro -->
    <div class="row g-2 mb-3 justify-content-center">
      <div class="col-md-3 col-sm-6">
        <select id="filtroParticipacao" class="form-select">
          <option value="">Filtrar por Participação</option>
        </select>
      </div>
      <div class="col-md-2 col-sm-6">
        <button id="btnLimpar" class="btn btn-secondary w-100">Limpar</button>
      </div>
    </div>

    <!-- Galeria -->
    <div id="gallery" class="gallery"></div>
  </div>

  <!-- Template do Card -->
  <template id="equipe-item-template">
    <div class="card">
      <img class="card-img" alt="">
      <div class="legend">
        <strong class="text-center card-nome"></strong>
        <strong><span class="text-center card-participacao"></span></strong>
        <span class="card-formacao"></span>
        <strong class="text-center">Clique no botão e acesse:</strong>
        <span class="card-lattes"></span>
      </div>
    </div>
  </template>

  <script src="javascript/dados-autores.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const idsEquipe = ["1","3","5","7", "9","10","22"];
      const autores = listarItens('autores');
      const container = document.getElementById('gallery');
      const filtroParticipacao = document.getElementById('filtroParticipacao');
      const template = document.getElementById('equipe-item-template');

      const lista = idsEquipe
        .map(id => autores.find(a => String(a.id) === id))
        .filter(Boolean)
        .sort((a, b) => a.nome.localeCompare(b.nome, 'pt', { sensitivity: 'base' }));

      // Popular filtro de participação
      const participacoes = [...new Set(lista.map(a => a.tipoParticipacao).filter(Boolean))].sort();
      participacoes.forEach(p => filtroParticipacao.append(new Option(p, p)));

      function renderizarEquipe(filtro = '') {
        container.innerHTML = '';
        const filtrados = lista.filter(a => !filtro || a.tipoParticipacao === filtro);

        filtrados.forEach(autor => {
          const clone = template.content.cloneNode(true);
          const img = clone.querySelector('.card-img');
          const nome = clone.querySelector('.card-nome');
          const participacao = clone.querySelector('.card-participacao');
          const formacao = clone.querySelector('.card-formacao');

// ===== LATTES (BOTÃO ESTILIZADO) =====
      const lattes = clone.querySelector('.card-lattes');
if (autor.lattes && autor.lattes.trim() !== '') {
  const link = document.createElement('a');
  link.href = autor.lattes;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.className = 'btn btn-outline-primary btn-sm w-100 mt-2';

  link.innerHTML = `
    <i class="bi bi-mortarboard-fill me-1"></i> Currículo Lattes
  `;

  lattes.innerHTML = '';
  lattes.appendChild(link);
} else {
  lattes.innerHTML = `
    <span class="text-muted small">Lattes não informado</span>
  `;
}

          img.src = `imagens/autores_equipe/${autor.imagem || 'default.jpg'}`;
          img.alt = `Foto de ${autor.nome}`;
          img.onerror = () => {
            img.src = 'imagens/autores_equipe/default.jpg';
            img.alt = 'Foto não disponível';
          };

          nome.textContent = autor.nome ?? '';
          participacao.textContent = autor.tipoParticipacao ?? '';
          formacao.textContent = autor.formacao ?? 'Formação não informada.';
          container.appendChild(clone);
        });
      }

      renderizarEquipe();

      filtroParticipacao.addEventListener('change', () => renderizarEquipe(filtroParticipacao.value));
      document.getElementById('btnLimpar').addEventListener('click', () => {
        filtroParticipacao.value = '';
        renderizarEquipe();
      });
    });
  </script>

  <meu-tradutor></meu-tradutor>
  <script src="javascript/components/tradutor.js" defer></script>
  <meu-footer></meu-footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
