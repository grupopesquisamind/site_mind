<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>MIND - Equipe Atual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap e Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Componentes -->
  <script src="javascript/components/menu.js" defer></script>
  <script src="javascript/components/footer.js" defer></script>
  <script src="javascript/components/components.js" defer></script>
  <link rel="stylesheet" href="css/style.css">

  <style>
  #page-wrapper {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 100vh;
    margin: auto;
    overflow: auto;
  }

  h2, h5 {
    text-align: center;
  }

  /* ===== Galeria Responsiva ===== */
  .gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:1.8rem;
padding:10px;
justify-items:center;
}

  /* ===== Card ===== */
 .card{
display:flex;
flex-direction:column;
background:#fff;
border-radius:14px;
overflow:hidden;

width:100%;
max-width:520px;   /* largura maior */

height:100%;

box-shadow:0 4px 14px rgba(0,0,0,0.12);
transition:all .25s ease;

border-top:4px solid #0d6efd;
}

  .card:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

 .card img{
width: 50%;
height:250px;
object-fit:cover;
object-position:center;
margin: 0 auto;
display: block;
}

  /* ===== Legenda ===== */
    .legend {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 1rem;
    font-size: 0.88rem;
    background: #fff;
    color: #444;
    height: auto;
    min-height: 260px;
    overflow-y: auto;
    max-height: none;
  }

  .card-nome {
    font-weight: 600;
    color: #000;
    margin-bottom: 0.3rem;
  }

  .card-participacao {
    font-size: 0.85rem;
    color: #007bff;
    margin-bottom: 0.2rem;
  }

  .card-formacao {
    font-size: 0.80rem;
    color: #555;
    text-align: justify;
    line-height: 1.45;
    overflow: visible;
    flex-grow: 1;
    max-height: none;
    margin-bottom: 0.5rem;
    hyphens: auto;
    word-break: break-word;
    }

  /* ===== Top Section - Cards same size ===== */
#top-gallery {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.8rem;
    padding: 10px;
    justify-items: center;
    align-items: start;
  }

  #top-gallery .card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

#bottom-gallery {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.8rem;
    padding: 10px;
    justify-items: center;
    align-items: start;
  }

  /* ===== Responsividade ===== */
  @media (max-width: 576px) {
    .gallery, #bottom-gallery { grid-template-columns: repeat(2, 1fr); }
    #top-gallery { flex-direction: column; align-items: center; }
    .card { max-width: 280px; }
  }

  @media (max-width: 400px) {
    .gallery, #bottom-gallery { grid-template-columns: 1fr; }
    .card { max-width: 100%; }
  }

    </style>
</head>

<body class="py-0">
  <meu-menu></meu-menu>

  <div id="page-wrapper" class="container-fluid my-4">
    <h2 class="text-danger fw-bold">Movimento para Inclusão e Neurodiversidade</h2>

    <div class="d-flex justify-content-center align-items-center flex-wrap gap-2 mt-3 mb-3">
      <h5 class="text-black m-0">Conheça os Membros Atuais da Equipe</h5>
      <a href="autores.html" class="btn btn-primary">
        <i class="bi bi-arrow-left-circle me-1"></i> Ver Dados Completos
      </a>
    </div>

    <!-- Seção Superior: Coordenação e Colaboradores Internos -->
    <div class="mb-5">
      <h4 class="text-center text-primary mb-4 fw-bold">📢 Coordenação e Colaboradores Internos</h4>
      <div id="top-gallery" class="d-flex flex-wrap justify-content-center gap-4"></div>
    </div>

    
<!-- Filtro para seção inferior -->
    <div class="row g-2 mb-3 justify-content-center">
      <div class="col-md-3 col-sm-6">
        <select id="filtroParticipacao" class="form-select">
          <option value="">Filtrar demais Colaboradores</option>
        </select>
      </div>
      <div class="col-md-2 col-sm-6">
        <button id="btnLimpar" class="btn btn-secondary w-100">Limpar</button>
      </div>
    </div>
    <!-- Seção Inferior: Demais Colaboradores -->
    <div>
      <h4 class="text-center text-success mb-4 fw-bold">👥 Demais Colaboradores</h4>
      <div id="bottom-gallery" class="gallery"></div>
    </div>
  </div>

  <!-- Template do Card -->
  <template id="equipe-item-template">
    <div class="card">
      <img class="card-img" alt="">
      <div class="legend">
        <strong class="text-center card-nome"></strong>
        <strong><span class="text-center card-participacao"></span></strong>
        <span class="card-formacao"></span>
        <strong class="text-center">Clique no botão e acesse:</strong>
        <span class="card-lattes"></span>
      </div>
    </div>
  </template>

  <script src="javascript/dados-autores.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const idsEquipe = ["1","3","5","7", "9","10","22"];
      const autores = listarItens('autores');
      const topContainer = document.getElementById('top-gallery');
      const bottomContainer = document.getElementById('bottom-gallery');
      const filtroParticipacao = document.getElementById('filtroParticipacao');
      const template = document.getElementById('equipe-item-template');

      const lista = idsEquipe
        .map(id => autores.find(a => String(a.id) === id))
        .filter(Boolean)
        .sort((a, b) => a.nome.localeCompare(b.nome, 'pt', { sensitivity: 'base' }));

      // Separação: Top (Coordenação e Colaborador Interno), Bottom (resto)
      const topEquipe = lista.filter(a => 
        a.tipoParticipacao === 'Coordenação' || a.tipoParticipacao === 'Colaborador Interno'
      ).sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
      
      const bottomEquipe = lista.filter(a => 
        !topEquipe.some(t => t.id === a.id)
      ).sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));

      // Popular filtro de participação (apenas bottom)
      const participacoes = [...new Set(bottomEquipe.map(a => a.tipoParticipacao).filter(Boolean))].sort();
      participacoes.forEach(p => filtroParticipacao.append(new Option(p, p)));

      // Função auxiliar para renderizar cards
      function renderCard(autor, container) {
        const clone = template.content.cloneNode(true);
        const img = clone.querySelector('.card-img');
        const nome = clone.querySelector('.card-nome');
        const participacao = clone.querySelector('.card-participacao');
        const formacao = clone.querySelector('.card-formacao');
        const lattes = clone.querySelector('.card-lattes');

        if (autor.lattes && autor.lattes.trim() !== '') {
          const link = document.createElement('a');
          link.href = autor.lattes;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.className = 'btn btn-outline-primary btn-sm w-100 mt-2';
          link.innerHTML = `<i class="bi bi-mortarboard-fill me-1"></i> Currículo Lattes`;
          lattes.innerHTML = '';
          lattes.appendChild(link);
        } else {
          lattes.innerHTML = `<span class="text-muted small">Lattes não informado</span>`;
        }

        img.src = `imagens/autores_equipe/${autor.imagem || 'default.jpg'}`;
        img.alt = `Foto de ${autor.nome}`;
        img.onerror = () => {
          img.src = 'imagens/autores_equipe/default.jpg';
          img.alt = 'Foto não disponível';
        };

        nome.textContent = autor.nome ?? '';
        participacao.textContent = autor.tipoParticipacao ?? '';
        formacao.textContent = autor.formacao ?? 'Formação não informada.';
        container.appendChild(clone);
      }

      // Renderiza top (fixo, sem filtro)
      function renderTopEquipe() {
        topContainer.innerHTML = '';
        topEquipe.forEach(autor => renderCard(autor, topContainer));
      }

      // Renderiza bottom (com filtro)
      function renderBottomEquipe(filtro = '') {
        bottomContainer.innerHTML = '';
        const filtrados = bottomEquipe.filter(a => !filtro || a.tipoParticipacao === filtro);
        filtrados.forEach(autor => renderCard(autor, bottomContainer));
      }

      renderTopEquipe();
      renderBottomEquipe();

      filtroParticipacao.addEventListener('change', () => renderBottomEquipe(filtroParticipacao.value));
      document.getElementById('btnLimpar').addEventListener('click', () => {
        filtroParticipacao.value = '';
        renderBottomEquipe();
      });
    });
  </script>

  <meu-tradutor></meu-tradutor>
  <script src="javascript/components/tradutor.js" defer></script>
  <meu-footer></meu-footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
