<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Projetos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== Estilos ===== -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- ===== Componentes ===== -->
  <script src="javascript/components/menu.js" defer></script>
  <script src="javascript/components/footer.js" defer></script>
  <script src="javascript/components/components.js" defer></script>

  <!-- ===== Proteção global (bloqueios) ===== -->
  <script src="javascript/protecao-global.min.js" defer></script>

  <style>
    body {
      font-family: "Arial", sans-serif;
      background-color: #f8f9fa;
      text-align: justify;
    }

    #page-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 100vh;
      max-width: 100%;
      margin: auto;
      overflow: auto;
    }

    .grafico-container {
      position: relative;
      height: 250px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    #graficoProjetos {
      width: 100%;
      height: 100%;
      display: block;
    }

    .modal-body p {
      text-align: justify;
      margin-bottom: 0.6rem;
    }

    .modal-body strong {
      color: #000;
    }

    /* === Responsividade === */
    @media (max-width: 768px) {
      h2.text-danger {
        font-size: 1.3rem;
      }

      h5,
      h6 {
        font-size: 1rem;
      }

      .grafico-container {
        height: 220px;
      }
    }

    @media (max-width: 576px) {
      .table {
        font-size: 0.85rem;
      }

      .btn-sm {
        font-size: 0.8rem;
        padding: 0.3rem;
      }

      .grafico-container {
        height: 200px;
      }
    }

    /* Ajustes dos botões */
    .btn-group-custom {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .btn-group-custom .btn {
      flex: 1 1 calc(50% - 6px);
      min-width: 130px;
    }

    @media (max-width: 576px) {
      .btn-group-custom .btn {
        flex: 1 1 100%;
      }
    }


    /* ===== IMPRESSÃO COMPLETA ===== */
    /*configuração para imprimir pagina*/
    @media print {

      /* FAZ O MENU APARECER NORMAL */
      meu-menu,
      nav,
      .navbar {
        position: static !important;
        width: 100% !important;
        display: block !important;
        width: 100%;
      }


      /* Esconde só botões de ação geral */
      .no-print {
        display: none !important;
      }

      header {
        position: static !important;
      }

      @page {
        size: A4;
        margin: 15mm;
      }

      html,
      body {
        height: 100% !important;
      }

      /* remove limitações */
      .container,
      .container-fluid,
      #page-wrapper {
        overflow: visible !important;
        max-width: 100% !important;
      }


      /* EVITA SOBREPOSIÇÃO */
      body {
        margin-bottom: 80px;
        /* espaço real pro footer */
        margin-top: 0 !important;
        padding-top: 0 !important;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      #page-wrapper {
        flex: 1;
      }

      /* REMOVE SCROLL */
      .table-responsive {
        overflow: visible !important;
      }

      /* CONTROLE DE QUEBRA */
      table {
        width: 100%;
        page-break-inside: auto;
      }

      tr {
        page-break-inside: avoid;
      }

      thead {
        display: table-header-group;
      }

      #footerPrint {
        display: block !important;
        width: 100%;
        margin-top: 30px;
        padding-top: 10px;
        border-top: 1px solid #ccc;
        text-align: center;
        font-size: 10px;
        color: #444;
        page-break-inside: auto;
        page-break-before: always;
        position: static;
      }

      /* espaço extra antes do footer (opcional) */
      .quebra-final {
        page-break-inside: always;
        page-break-before: always;
        position: auto;
        height: 95%;
      }

    }
  </style>
</head>

<body class="py-0">
  <meu-menu></meu-menu>

  <div id="page-wrapper">
    <main class="container-fluid d-flex flex-column my-0 pt-0 mt-1 mb-5">
      <section class="mt-2">
        <h2 class="text-center text-danger">
          <strong>Movimento para Inclusão e Neurodiversidade.</strong>
        </h2>

        <div class="container text-center">
          <h5 class="text-black"><strong>Projetos desenvolvidos pela equipe MIND.</strong>
          </h5>
        </div>
        <h6 class="text-center">Gráfico: Projetos por Categoria e Ano</h6>
        <div class="grafico-container">
          <canvas id="graficoProjetos"></canvas>
        </div>

        <!-- === Filtros === -->
        <div class="row g-2 my-4">
          <div class="col-md-3">
            <input type="text" id="pesquisaInput" class="form-control" placeholder="Buscar por nome...">
          </div>
          <div class="col-md-2">
            <select id="filtroAutores" class="form-select">
              <option value="">Filtrar por Autores</option>
            </select>
          </div>
          <div class="col-md-2">
            <select id="filtroTipos" class="form-select">
              <option value="">Filtrar por Tipo</option>
            </select>
          </div>
          <div class="col-md-2">
            <select id="filtroCategorias" class="form-select">
              <option value="">Filtrar por Categoria</option>
            </select>
          </div>
          <div class="col-md-2">
            <select id="filtroAnos" class="form-select">
              <option value="">Filtrar por Ano</option>
            </select>
          </div>
          <div class="col-md-1">
            <button id="btnLimpar" class="btn btn-secondary w-100">Limpar</button>
          </div>
        </div>

        <div class="text-end my-2 no-print">
          <button onclick="imprimirPagina()" class="btn btn-outline-dark">
            🖨️ Imprimir Página
          </button>

          <button onclick="exportarExcel()" class="btn btn-success">
            📊 Exportar Dados
          </button>
        </div>
        <!-- === Tabela === -->
        <div class="table-responsive">
          <table id="tabelaProjetos" class="table table-striped table-bordered w-100">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nome do Jogo</th>
                <th>Título da Publicação</th>
                <th>Autor Desenvolvedor</th>
                <th>Tipo</th>
                <th>Categoria</th>
                <th>Ano</th>
                <th>Publicação</th>
                <th>Projeto</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>

        </div>
      </section>

    </main>
  </div>

  <!-- === Modal de Visualização do Projeto === -->
  <div class="modal fade" id="modalProjetos" tabindex="-1" aria-labelledby="modalProjetosLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalProjetosLabel">Visualizar Projeto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <iframe id="iframeProjetos" src="" width="100%" height="600" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- === Modal de Referência (área de cópia liberada) === -->
  <div class="modal fade" id="modalReferencia" tabindex="-1" aria-labelledby="modalReferenciaLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalReferenciaLabel">Dados do Projeto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="conteudoReferencia"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Scripts ===== -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="javascript/dados-projetos.js"></script>

  <script>
    let chartInstance;
    let tabelaDT;

    document.addEventListener('DOMContentLoaded', () => {
      const itens = listarItens('projetos');
      const selAutores = $('#filtroAutores');
      const selTipos = $('#filtroTipos');
      const selCategorias = $('#filtroCategorias');
      const selAnos = $('#filtroAnos');

      function popularFiltros() {
        const autores = [...new Set(itens.map(i => i.autor))].sort();
        const tipos = [...new Set(itens.map(i => i.tipo))].sort();
        const categorias = [...new Set(itens.map(i => i.categoria))].sort();
        const anos = [...new Set(itens.map(i => i.ano))].sort();
        autores.forEach(v => selAutores.append(new Option(v, v)));
        tipos.forEach(v => selTipos.append(new Option(v, v)));
        categorias.forEach(v => selCategorias.append(new Option(v, v)));
        anos.forEach(v => selAnos.append(new Option(v, v)));
      }

      function aplicarFiltros() {
        const q = $('#pesquisaInput').val().toLowerCase();
        const a = selAutores.val();
        const t = selTipos.val();
        const c = selCategorias.val();
        const y = selAnos.val();
        return itens.filter(i =>
          (!a || i.autor === a) &&
          (!t || i.tipo === t) &&
          (!c || i.categoria === c) &&
          (!y || i.ano === y) &&
          (!q || i.nomeProducao.toLowerCase().includes(q))
        );
      }

      function renderizarTabela(data) {
        if (tabelaDT) {
          tabelaDT.clear().rows.add(data).draw();
        } else {
          tabelaDT = $('#tabelaProjetos').DataTable({
            data: data,
            pageLength: 10,
            lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "Todos"]],
            deferRender: false,
            columns: [
              { data: 'id' },
              { data: 'nomeProducao' },
              { data: 'titulo' },
              { data: 'autor', render: d => `<strong>${d}</strong>` },
              { data: 'tipo' },
              { data: 'categoria', render: d => `<strong>${d}</strong>` },
              { data: 'ano' },
              {
                data: null,
                render: d => `
                  <div class="d-flex flex-column align-items-center gap-1">
                    <a href="${d.linkPublicacao}" class="btn btn-warning btn-sm w-100" target="_blank">🌐 Online</a>
                    ${d.publicacaoArquivo
                    ? `<a href="${d.publicacaoArquivo}" class="btn btn-success btn-sm w-100" target="_blank">📖 PDF</a>`
                    : `<button class="btn btn-secondary btn-sm w-100" disabled>❌ Sem PDF</button>`
                  }
                  </div>`
              },
              {
                data: null,
                render: d => `
                  <div class="d-flex flex-column align-items-center gap-1">
                    <button class="btn btn-danger btn-sm w-100" onclick="abrirJanela('${d.id}')">🔗 Abrir</button>
                    <button class="btn btn-primary btn-sm w-100" onclick='mostrarReferencia(${JSON.stringify(d)})'>📄 Citar</button>
                  </div>`
              }
            ],
            paging: true,
            responsive: true,
            language: {
              info: "Mostrando _START_ até _END_ de _TOTAL_ registros",
              infoEmpty: "Mostrando 0 até 0 de 0 registros",
              lengthMenu: "Mostrar _MENU_ registros por página",
              search: "Pesquisar:",
              paginate: {
                first: "Primeiro", last: "Último", next: "Próximo", previous: "Anterior"
              }
            }
          });
        }
      }



      function renderizarGrafico(data) {
        const group = {};
        data.forEach(i => {
          if (!group[i.categoria]) group[i.categoria] = {};
          if (!group[i.categoria][i.ano]) group[i.categoria][i.ano] = 0;
          group[i.categoria][i.ano]++;
        });

        const categoriasArr = Object.keys(group);
        const anosArr = [...new Set(data.map(i => i.ano))].sort();
        const colors = ['#007bff', '#28a745', '#ffc107', '#dc3545', '#17a2b8'];
        const datasets = categoriasArr.map((cat, idx) => ({
          label: cat,
          backgroundColor: colors[idx % colors.length],
          data: anosArr.map(y => group[cat][y] || 0)
        }));

        const ctx = document.getElementById('graficoProjetos').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: { labels: anosArr, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom' },
              datalabels: { anchor: 'end', align: 'end', formatter: Math.round }
            },
            scales: {
              x: { grid: { display: false } },
              y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } }
            }
          },
          plugins: [ChartDataLabels]
        });
      }

      function atualizar() {
        const filtrado = aplicarFiltros();
        renderizarTabela(filtrado);
        renderizarGrafico(filtrado);
      }

      $('#pesquisaInput, #filtroAutores, #filtroTipos, #filtroCategorias, #filtroAnos').on('input change', atualizar);
      $('#btnLimpar').on('click', () => {
        $('#pesquisaInput').val('');
        selAutores.val('');
        selTipos.val('');
        selCategorias.val('');
        selAnos.val('');
        atualizar();
      });

      popularFiltros();
      atualizar();
    });

    function abrirJanela(id) {
      const url = `modal.html?id=${id}`;
      window.open(url, '_blank', `width=1200,height=800,scrollbars=yes,resizable=yes`);
    }

    function mostrarReferencia(item) {
      const ref = `
        <p><strong>Nome do Projeto:</strong> ${item.nomeProducao}</p>
        <p><strong>Autor Desenvolvedor:</strong> ${item.autor}</p>
        <p><strong>Tipo:</strong> ${item.tipo}</p>
        <p><strong>Categoria:</strong> ${item.categoria}</p>
        <p><strong>Ano:</strong> ${item.ano}</p>
        <p><strong>Título da Publicação:</strong> ${item.titulo}</p>
        ${item.linkPublicacao
          ? `<p><strong>Link da Publicação:</strong> <a href="${item.linkPublicacao}" target="_blank">${item.linkPublicacao}</a></p>`
          : ''
        }
        ${item.publicacaoArquivo
          ? `<p><strong>Arquivo PDF:</strong> <a href="${item.publicacaoArquivo}" target="_blank">Abrir</a></p>`
          : ''
        }
        <hr>
        <div class="allow-copy">
          <p><strong style="color:red;">Como Referenciar pela ABNT:</strong><br>${item.referenciar || 'Referência não informada.'}</p>
          <button class="btn btn-outline-secondary btn-sm mt-2" onclick="copiarReferencia()">Copiar Referência</button>
          <small style="color:#888;">(Você pode copiar esta referência livremente)</small>
        </div>`;
      document.getElementById('conteudoReferencia').innerHTML = ref;
      new bootstrap.Modal(document.getElementById('modalReferencia')).show();
    }

    function copiarReferencia() {
      const ref = document.querySelector('.allow-copy');
      if (!ref) return;
      navigator.clipboard.writeText(ref.innerText.trim())
        .then(() => alert('Referência copiada!'))
        .catch(() => alert('Não foi possível copiar.'));
    }
  </script>

  <script>
    function imprimirPagina() {

      if (!tabelaDT) {
        window.print();
        return;
      }

      const info = tabelaDT.page.info();
      const totalFiltrado = info.recordsDisplay;
      const porPagina = info.length;

      const executarImpressao = () => {

        document.getElementById('footerPrint').style.display = 'block';

        setTimeout(() => {
          window.print();
          document.getElementById('footerPrint').style.display = 'none';
        }, 500);
      };

      // MAIS DE UMA PÁGINA
      if (totalFiltrado > porPagina) {

        const confirmar = confirm(
          `Existem ${totalFiltrado} registros distribuídos em várias páginas.\n\nDeseja exibir TODOS antes de imprimir?`
        );

        if (confirmar) {

          const tamanhoAtual = tabelaDT.page.len();

          tabelaDT.page.len(-1).draw();

          setTimeout(() => {
            executarImpressao();
            tabelaDT.page.len(tamanhoAtual).draw();
          }, 800);

        } else {
          executarImpressao();
        }

        return;
      }

      executarImpressao();
    }
  </script>

  <script>
    function exportarExcel() {

      if (!tabelaDT) return;

      const dados = tabelaDT.rows({ search: 'applied' }).data().toArray();

      let csv = "ID;Identificação Arquivo;Nome do Jogo;Título;Autor;Tipo;Categoria;Ano;Publicação;Projeto;Referenciar\n";

      dados.forEach(d => {
        const ref = (d.referenciar || "")
          .replace(/"/g, '""')     // escapa aspas
          .replace(/\n/g, ' ')     // remove quebra de linha
          .replace(/\r/g, ' ')     // remove quebra de linha windows
          .replace(/;/g, ',');     // evita quebrar coluna

         /*caso o caminho seja fixo*/
        const nomeArquivo = d.publicacaoArquivo.replace("publicacaoArquivo/Publicacoes_Jogos/", "");

        /**caminho relativo*/
       /* const nomeArquivo = (d.publicacaoArquivo || "").split('/').pop();*/
       
          csv += `${d.id};${nomeArquivo};"${d.nomeProducao}";"${d.titulo}";"${d.autor}";${d.tipo};${d.categoria};${d.ano};${d.linkPublicacao};${d.src};"${ref}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });

      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "projetos.xlsx";
      link.click();
    }
  </script>


  <meu-tradutor></meu-tradutor>
  <script src="javascript/components/tradutor.js" defer></script>

  <div class="quebra-final"></div>
  <div id="footerPrint">
    <meu-footer></meu-footer>
  </div>

</body>

</html>
