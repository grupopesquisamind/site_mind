<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Publicações por Autor - MIND</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== Estilos ===== -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />

  <!-- ===== Componentes ===== -->
  <script src="javascript/components/menu.js" defer></script>
  <script src="javascript/components/footer.js" defer></script>
  <script src="javascript/components/components.js" defer></script>
  <script src="javascript/components/tradutor.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- ===== Proteção global (bloqueios) ===== -->
  <script src="javascript/protecao-global.min.js" defer></script>

  <style>
    body {
      font-family: "Arial", sans-serif;
      background-color: #f8f9fa;
    }

    #page-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 100vh;
      height: auto;
      max-width: 100%;
      margin: auto;
      overflow: visible;
    }

    @media print {
      meu-menu, nav, .navbar { position: static !important; width: 100% !important; display: block !important; }
      .no-print { display: none !important; }
      header { position: static !important; }
      @page { size: A4; margin: 15mm; }
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 font-sans flex min-h-screen overflow-x-hidden py-0">
  <meu-menu></meu-menu>

  <div class="flex-1 flex flex-col min-h-screen overflow-y-auto">
        <div id="page-wrapper">
      <main class="container-fluid d-flex flex-column my-0 pt-0 mt-1 mb-5 p-6 flex-1">
        <section class="mt-2">
          <h2 class="text-center text-danger mb-2"><strong>Movimento para Inclusão e Neurodiversidade</strong></h2>
          <h3 class="text-center text-primary mb-4">Total de Publicações: como Autor e Co-autor</h3>

          <!-- Botões de Acesso Rápido -->
          <div class="d-flex justify-content-center align-items-center mb-4 flex-wrap gap-2">
            <h5 class="text-center text-black mb-0 me-2">Autores ligados à equipe MIND</h5>
            <a href="galeriaautores.html" class="btn btn-danger">
              <i class="bi bi-people-fill me-1"></i> Ver Galeria de Fotos
            </a>
            <a href="autores.html" class="btn btn-primary">
              <i class="bi bi-people-fill me-1"></i> Acessar Listagem de Autores
            </a>
          </div>

          <!-- Tabela de Autores e Publicações -->
          <div class="container-fluid row justify-content-center mx-auto">
            <div class="col-md-12">
              <div class="table-responsive">
                <table id="tabelaAutores" class="table table-striped table-bordered w-100">
                  <thead class="table-dark">
                    <tr>
                      <th>Nome do Autor</th>
                      <th>Autoria</th>
                      <th>Co-autor</th>
                      <th>Total</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <meu-footer></meu-footer>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="javascript/dados-publicacoes.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const publicacoes = typeof listarItens === 'function' ? listarItens('publicacoes') : [];
      const mapaAutores = {};

      function normalizarNome(nome) {
        return nome ? nome.trim() : '';
      }

      publicacoes.forEach(pub => {
        const autorPrincipal = normalizarNome(pub.autor);
        if (autorPrincipal) {
          if (!mapaAutores[autorPrincipal]) {
            mapaAutores[autorPrincipal] = { autoria: 0, coautor: 0 };
          }
          mapaAutores[autorPrincipal].autoria++;
        }

        if (pub.coautor) {
          const coautoresLista = pub.coautor.split(/[,;]/).map(c => normalizarNome(c)).filter(Boolean);
          coautoresLista.forEach(c => {
            if (c) {
              if (!mapaAutores[c]) {
                mapaAutores[c] = { autoria: 0, coautor: 0 };
              }
              mapaAutores[c].coautor++;
            }
          });
        }
      });

      const dadosTabela = Object.keys(mapaAutores).map(nome => {
        const aut = mapaAutores[nome].autoria;
        const coaut = mapaAutores[nome].coautor;
        return {
          nome: nome,
          autoria: aut,
          coautor: coaut,
          total: aut + coaut
        };
      }).sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));

      if ($('#tabelaAutores').length) {
        $('#tabelaAutores').DataTable({
          data: dadosTabela,
          pageLength: 25,
          lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "Todos"]],
          autoWidth: false,
          scrollCollapse: false,
          scroller: false,
          columns: [
            { data: 'nome', render: d => `<strong>${d}</strong>` },
            { data: 'autoria', className: 'text-center' },
            { data: 'coautor', className: 'text-center' },
            { data: 'total', className: 'text-center', render: d => `<span class="badge bg-success">${d}</span>` }
          ],
          language: {
            info: "Mostrando _START_ até _END_ de _TOTAL_ registros",
            infoEmpty: "Mostrando 0 até 0 de 0 registros",
            lengthMenu: "Mostrar _MENU_ registros por página",
            search: "Pesquisar:",
            paginate: { first: "Primeiro", last: "Último", next: "Próximo", previous: "Anterior" }
          }
        });
      }
    });
  </script>

  <meu-tradutor></meu-tradutor>
</body>

</html>
